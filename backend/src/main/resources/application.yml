spring:
  application:
    name: vesta-zero
  config:
    # Local development: read ANTHROPIC_API_KEY and DB settings from the repo's .env (gitignored).
    # In Docker the variables come from the environment and this file is absent.
    import: optional:file:../.env[.properties]
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:vesta}
    username: ${DB_USER:vesta}
    password: ${DB_PASSWORD:vesta}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:vesta}
    user: ${DB_USER:vesta}
    password: ${DB_PASSWORD:vesta}
    locations: classpath:db/migration

server:
  port: ${BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

vesta:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  psi:
    base-url: https://psi.nasa.gov/geode-py/ws
    request-delay: 2s
    timeout: 60s
  llm:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-opus-5-5}
